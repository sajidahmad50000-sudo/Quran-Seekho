name: Flutter Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          test -f QuranSeekho-v3.4/pubspec.yaml
          test -f QuranSeekho-v3.4/lib/main.dart

      - name: Flutter pub get
        working-directory: QuranSeekho-v3.4
        run: flutter pub get

      - name: Analyze
        working-directory: QuranSeekho-v3.4
        run: flutter analyze

      - name: Build APK
        working-directory: QuranSeekho-v3.4
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-seekho-apk
          path: QuranSeekho-v3.4/build/app/outputs/flutter-apk/app-release.apk
