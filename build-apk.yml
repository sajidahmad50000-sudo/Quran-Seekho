name: Build Quran Seekho APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Quran Seekho ZIP
        run: |
          unzip -q Quran_Seekho_QuranReadingTutor_v2.7.zip -d project

      - name: Find Flutter project
        run: |
          PROJECT=$(find project -name pubspec.yaml -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: |
          cd "$PROJECT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Seekho-APK
          path: "${{ env.PROJECT }}/build/app/outputs/flutter-apk/*.apk"
